<title>Kökten</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column, phone first. A small dot triangle (axioms at the base, the sentence at the apex) acts as the map; under it, the fact being learned now; under that, every fact in reading order. */
:root{
  --bg:#f1f3f6; --surface:#ffffff; --fg:#18202b; --muted:#5a6575; --line:#c3ccd8;
  --accent:#2c4f86; --accent-fg:#ffffff; --soft:#dfe7f3; --hot:#d08a1f;
  --ok:#2f7a4a; --part:#a8680e; --bad:#b23a2e; --unk:#7a8494;
  --display:"Literata",Georgia,serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#19202a; --fg:#e4e9f0; --muted:#98a3b3; --line:#3a4757;
  --accent:#8fb2ec; --accent-fg:#0d1420; --soft:#223047; --hot:#f0b252;
  --ok:#6cc48c; --part:#e2a64a; --bad:#ec8679; --unk:#9aa4b3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#19202a; --fg:#e4e9f0; --muted:#98a3b3; --line:#3a4757;
  --accent:#8fb2ec; --accent-fg:#0d1420; --soft:#223047; --hot:#f0b252;
  --ok:#6cc48c; --part:#e2a64a; --bad:#ec8679; --unk:#9aa4b3; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);padding-inline:16px}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 32px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
h1{font:650 30px/1 var(--display);margin:0;letter-spacing:-.01em}
.tag{color:var(--muted);font-size:14px;flex:1 1 auto}
.status{font:500 12px var(--mono);color:var(--muted)}
.status b{font-weight:500;color:var(--ok)} .status.off b{color:var(--bad)}
.lbl{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

.ask{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ask:focus-within{border-color:var(--accent)}
textarea{width:100%;box-sizing:border-box;resize:vertical;min-height:60px;border:0;background:transparent;color:var(--fg);font:16px/1.5 var(--body);padding:0}
textarea:focus{outline:none}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.btn{font:600 14px var(--body);background:var(--accent);color:var(--accent-fg);border:0;border-radius:9px;padding:9px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
select{font:500 12px var(--mono);color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 6px}
.banner{font-size:14px;color:var(--bad);margin:0}
.example{align-self:flex-start;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--part);border:1px solid currentColor;border-radius:999px;padding:3px 10px}

/* triangle map */
.map{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 0 6px}
.map svg{display:block;width:100%;overflow:visible}
.map .ends{display:flex;justify-content:space-between;padding:0 12px}
g.n{cursor:pointer;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
g.n .hit{fill:transparent}
g.n .dot{fill:var(--surface);stroke:var(--line);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.3,1.4,.5,1) both;transition:fill .3s,stroke .3s,r .3s}
g.n.learned .dot{fill:var(--accent);stroke:var(--accent)}
g.n.in .dot{fill:var(--hot);stroke:var(--hot)}
g.n.cur .dot{fill:var(--accent);stroke:var(--fg);stroke-width:3}
g.n .ring{fill:none;stroke:var(--accent);stroke-width:2;opacity:0}
g.n.cur .ring{opacity:.35;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
g.n:focus-visible{outline:none} g.n:focus-visible .dot{stroke:var(--hot);stroke-width:3}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes pulse{from{transform:scale(1);opacity:.45}to{transform:scale(1.9);opacity:0}}
path.e{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s ease-out .15s forwards;transition:stroke .3s,opacity .3s}
path.e.learned{stroke:var(--accent);opacity:.45}
path.e.hot{stroke:var(--hot);opacity:1;stroke-width:2.5}
@keyframes draw{to{stroke-dashoffset:0}}

/* current fact */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.card.flip{animation:flip .35s ease-out}
@keyframes flip{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.verdict{font:500 11px var(--mono);color:var(--vc)}
.v-dogru{--vc:var(--ok)} .v-kismen{--vc:var(--part)} .v-yanlis{--vc:var(--bad)} .v-belirsiz{--vc:var(--unk)}
.card h2{font:650 20px/1.3 var(--display);margin:0;text-wrap:balance}
.card p{margin:0}
.card .n{color:var(--vc);font-size:14px} .card .n b{font-weight:600}
.refs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.ref{font:500 13px/1.3 var(--body);color:var(--fg);background:var(--bg);border:1.5px solid var(--hot);border-radius:999px;padding:4px 10px;cursor:pointer;text-align:left}
.ref.up{border-color:var(--line);border-style:dashed}
.nav{display:flex;align-items:center;gap:8px;margin-top:4px;padding-top:10px;border-top:1px solid var(--line)}
.count{font:500 12px var(--mono);color:var(--muted);margin-right:auto;font-variant-numeric:tabular-nums}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.18s} .dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.err{color:var(--bad);font-size:14px}

/* reading-order list */
.ladder{display:flex;flex-direction:column;gap:2px}
.ladder h3{margin:12px 0 4px;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.ladder h3:first-child{margin-top:0}
.rung{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 10px;color:var(--muted);font:14px/1.4 var(--body);cursor:pointer;animation:fade .4s both}
.rung::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;border:2px solid var(--line);transform:translateY(1px)}
.rung.learned{color:var(--fg)} .rung.learned::before{background:var(--accent);border-color:var(--accent)}
.rung.cur{background:var(--soft);color:var(--fg);font-weight:600}
.rung:hover{background:var(--soft)}
.rung .flag{margin-left:auto;font:500 11px var(--mono);color:var(--vc);white-space:nowrap}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}path.e{stroke-dashoffset:0}}
</style>

<div class="wrap">
  <header>
    <h1>Kökten</h1>
    <span class="tag">Bir cümleyi aksiyomlarından başlayarak anla.</span>
    <span class="status" id="status">bağlanıyor…</span>
  </header>

  <form class="ask" id="form">
    <label class="lbl" for="sentence">Anlamak istediğin cümle</label>
    <textarea id="sentence">Sulawesi Adası'nda ölüleriyle yaşayan Toraja Kabilesi. Toraja Halkı ölülerini gömmeden önce birkaç seneye kadar beraber yaşayabiliyorlar hatta yemek ikram ediyorlar ölülerine.</textarea>
    <div class="row">
      <button class="btn" id="build" type="submit" disabled>Piramidi kur</button>
      <select id="tier" aria-label="Model">
        <option value="quick">hızlı</option>
        <option value="default" selected>dengeli</option>
        <option value="complex">derin</option>
      </select>
    </div>
  </form>

  <p class="banner" id="banner" hidden></p>
  <span class="example" id="exampleTag">Örnek · kendi cümleni yazıp "Piramidi kur"a bas</span>

  <section class="map" aria-label="Bilgi piramidi">
    <div class="ends"><span class="lbl">cümle</span><span class="lbl" id="levels"></span></div>
    <svg id="map" role="group"></svg>
    <div class="ends"><span class="lbl">aksiyomlar</span><span class="lbl">temel</span></div>
  </section>

  <section class="card" id="card" aria-live="polite"></section>

  <section class="ladder" id="ladder" aria-label="Okuma sırası"></section>
</div>

<script>
const $ = id => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";
const VERDICT = { dogru: "doğru", kismen: "kısmen doğru", yanlis: "yanlış", belirsiz: "belirsiz" };
const ERR = {
  not_granted: "Bu sayfanın Claude kullanmasına izin verilmedi. İzin vermek için sayfayı yeniden yükle.",
  sampling_disabled: "Bu hesapta Claude kullanılamıyor.",
  rate_limited: "Çok fazla istek gitti ya da kullanım limitin doldu. Biraz sonra tekrar dene.",
  session_expired: "Oturumun kapanmış. claude.ai'a tekrar giriş yap.",
  refused: "Claude bu cümle için piramit kurmadı. Cümleyi değiştirip tekrar dene.",
  prompt_too_large: "Metin çok uzun. Daha kısa bir cümle dene.",
};
const FATAL = ["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"];

function prompt(s){
  return `Kullanıcı şu cümleyi, bir matematik ifadesini aksiyomlardan kurar gibi, en temel bilgilerden başlayarak anlamak istiyor:
"""${s}"""

Bu cümleyi tepeye koyan bir bilgi piramidi kur:
- Seviye 0: aksiyomlar. Başka bir şeye dayanmadan anlaşılan, herkesin kabul edeceği en temel fact'ler. 5-8 tane.
- Her üst seviyedeki fact, yalnızca daha alt seviyelerdeki fact'lerden çıkar. Yukarı çıktıkça her seviyede daha az fact olsun.
- En üstte tek düğüm: cümlenin kendisi, kısaltılmış hâliyle. Toplam 4-6 seviye.
- "u": düğümün dayandığı alt düğümlerin id'leri. Seviye 0'da boş. Diğer her düğüm en az bir alt düğüme dayansın. Tepe dışındaki her düğüm en az bir üst düğümde kullanılsın.
- "d": aksiyomlarda fact'in kendisini açıkla. Üst düğümlerde bu fact'in dayandığı düğümlerden NASIL çıktığını açıkla.
- Cümledeki hata ya da abartıları ilgili düğümde "v" ve "n" ile belirt; tepe düğümün "v" değeri cümlenin bütün olarak ne kadar doğru olduğunu söylesin.

Düğümleri seviye sırasıyla yaz: önce bütün seviye 0, sonra seviye 1, en son tepe. Her satıra tek bir JSON nesnesi yaz. Başka hiçbir şey yazma: giriş, kod bloğu, numara yok.
{"id":"a1","l":0,"t":"en fazla 6 kelimelik başlık","d":"1-3 cümle","u":[],"v":"dogru|kismen|yanlis|belirsiz","n":"v dogru değilse düzeltme, dogru ise boş"}
Her şeyi Türkçe yaz.`;
}

/* ---------- state ---------- */
let sample = null;
let nodes = new Map(), steps = [], edges = [];
let cur = -1, reached = -1, building = false, ctl = null;
const mapSvg = $("map");
const gEdges = document.createElementNS(SVGNS, "g"), gNodes = document.createElementNS(SVGNS, "g");
mapSvg.append(gEdges, gNodes);

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function svg(tag, attrs){
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
const maxLevel = () => steps.reduce((m, n) => Math.max(m, n.l), 0);
const isApex = n => steps.length > 1 && n.l === maxLevel();
const levelName = n => isApex(n) ? "Cümle" : n.l === 0 ? "Aksiyom" : `Seviye ${n.l}`;

function reset(){
  nodes = new Map(); steps = []; edges = [];
  cur = -1; reached = -1;
  gEdges.textContent = ""; gNodes.textContent = "";
}

function parseLine(line){
  const a = line.indexOf("{"), b = line.lastIndexOf("}");
  if (a < 0 || b <= a) return null;
  try {
    const o = JSON.parse(line.slice(a, b + 1));
    const id = String(o.id || "").trim(), t = String(o.t || "").trim();
    const l = Math.max(0, Math.round(Number(o.l)) || 0);
    if (!id || !t || nodes.has(id)) return null;
    return { id, l, t, d: String(o.d || "").trim(), u: Array.isArray(o.u) ? o.u.map(String) : [],
             v: VERDICT[o.v] ? o.v : "belirsiz", n: String(o.n || "").trim() };
  } catch { return null; }
}

function addNode(d){
  const n = { ...d, u: d.u.filter(x => nodes.has(x) && nodes.get(x).l < d.l), ups: [] };
  nodes.set(n.id, n);
  steps.push(n);
  steps.sort((a, b) => a.l - b.l);   // stable: reading order is level by level
  const g = svg("g", { class: "n", tabindex: "0", role: "button" });
  g.append(svg("circle", { class: "ring", r: 7 }), svg("circle", { class: "dot", r: 7 }), svg("circle", { class: "hit", r: 18 }));
  const title = svg("title", {}); title.textContent = n.t; g.append(title);
  g.addEventListener("click", () => go(steps.indexOf(n)));
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); go(steps.indexOf(n)); } });
  n.g = g;
  gNodes.appendChild(g);
  for (const id of n.u){
    nodes.get(id).ups.push(n.id);
    const p = svg("path", { class: "e", pathLength: 1 });
    gEdges.appendChild(p);
    edges.push({ from: id, to: n.id, path: p });
  }
  layout();
}

/* ---------- triangle geometry ---------- */
function layout(){
  const W = mapSvg.clientWidth || 320, top = maxLevel();
  const rowH = 46, pad = 18;
  const H = pad * 2 + top * rowH;
  mapSvg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  mapSvg.setAttribute("height", H);
  const byLevel = new Map();
  for (const n of steps){ if (!byLevel.has(n.l)) byLevel.set(n.l, []); byLevel.get(n.l).push(n); }
  for (const [l, row] of byLevel){
    const gap = Math.min(52, (W - 40) / Math.max(row.length - 1, 1));
    row.forEach((n, i) => {
      n.x = W / 2 + (i - (row.length - 1) / 2) * (row.length > 1 ? gap : 0);
      n.y = pad + (top - l) * rowH;
      n.g.style.transform = `translate(${n.x}px,${n.y}px)`;
      const r = isApex(n) ? 11 : 7;
      n.g.querySelectorAll(".dot,.ring").forEach(c => c.setAttribute("r", r));
    });
  }
  for (const e of edges){
    const a = nodes.get(e.from), b = nodes.get(e.to);
    e.path.setAttribute("d", `M${a.x},${a.y} L${b.x},${b.y}`);
  }
  paint();
}
new ResizeObserver(() => layout()).observe(mapSvg);

/* ---------- painting state ---------- */
function paint(){
  const now = steps[cur];
  steps.forEach((n, i) => {
    const learned = building || i <= reached;
    n.g.classList.toggle("learned", learned);
    n.g.classList.toggle("cur", n === now);
    n.g.classList.toggle("in", !!now && now.u.includes(n.id));
  });
  for (const e of edges){
    const a = steps.indexOf(nodes.get(e.from)), b = steps.indexOf(nodes.get(e.to));
    e.path.classList.toggle("learned", building || (a <= reached && b <= reached));
    e.path.classList.toggle("hot", !!now && e.to === now.id);
  }
  const lv = new Set(steps.map(n => n.l)).size;
  $("levels").textContent = steps.length ? `${steps.length} fact · ${lv} seviye` : "";
  renderCard();
  renderLadder();
}

function go(i){
  if (building || i < 0 || i >= steps.length) return;
  cur = i;
  reached = Math.max(reached, i);
  const card = $("card");
  card.classList.remove("flip"); void card.offsetWidth; card.classList.add("flip");
  paint();
}

function refChip(id, up){
  const m = nodes.get(id);
  const c = el("button", "ref" + (up ? " up" : ""), m.t);
  c.type = "button";
  c.addEventListener("click", () => go(steps.indexOf(m)));
  return c;
}

function renderCard(){
  const c = $("card");
  c.textContent = "";
  if (building){
    const row = el("div", "loading");
    const dots = el("span", "dots"); dots.append(el("i"), el("i"), el("i"));
    row.append(dots, el("span", null, steps.length ? `Claude piramidi kuruyor · ${steps.length} fact` : "Claude aksiyomları düşünüyor"));
    const stop = el("button", "btn ghost", "Durdur"); stop.type = "button";
    stop.addEventListener("click", () => ctl?.abort());
    const nav = el("div", "nav"); nav.append(el("span", "count"), stop);
    c.append(row, nav);
    return;
  }
  const n = steps[cur];
  if (!n){ c.append(el("p", null, "Bir cümle yaz ve piramidi kur.")); return; }

  const meta = el("div", "meta v-" + n.v);
  meta.append(el("span", "lbl", levelName(n)), el("span", "verdict", VERDICT[n.v]));
  c.append(meta, el("h2", null, n.t));
  if (n.d) c.append(el("p", null, n.d));
  if (n.n && n.v !== "dogru"){
    const x = el("p", "n v-" + n.v); x.append(el("b", null, "Düzeltme: "), n.n); c.append(x);
  }
  if (n.u.length){
    const r = el("div", "refs"); r.append(el("span", null, "Dayandığı:"));
    n.u.forEach(id => r.append(refChip(id, false))); c.append(r);
  }
  const ups = n.ups.filter(id => steps.indexOf(nodes.get(id)) <= reached);
  if (ups.length){
    const r = el("div", "refs"); r.append(el("span", null, "Üstüne kurulan:"));
    ups.forEach(id => r.append(refChip(id, true))); c.append(r);
  }

  const nav = el("div", "nav");
  nav.append(el("span", "count", `${cur + 1} / ${steps.length}`));
  const back = el("button", "btn ghost", "← Geri"); back.type = "button"; back.disabled = cur === 0;
  back.addEventListener("click", () => go(cur - 1));
  const last = cur === steps.length - 1;
  const next = el("button", "btn", last ? "Baştan" : "İleri →"); next.type = "button";
  next.addEventListener("click", () => go(last ? 0 : cur + 1));
  nav.append(back, next);
  c.append(nav);
}

function renderLadder(){
  const L = $("ladder");
  L.textContent = "";
  if (!steps.length) return;
  let lastLevel = -1;
  steps.forEach((n, i) => {
    if (n.l !== lastLevel){
      lastLevel = n.l;
      L.append(el("h3", null, isApex(n) ? "Cümle" : n.l === 0 ? "Aksiyomlar" : `Seviye ${n.l}`));
    }
    const r = el("button", "rung v-" + n.v);
    r.type = "button";
    r.append(el("span", null, n.t));
    if (n.v !== "dogru") r.append(el("span", "flag", VERDICT[n.v]));
    r.classList.toggle("learned", building || i <= reached);
    r.classList.toggle("cur", i === cur && !building);
    r.addEventListener("click", () => { go(i); $("card").scrollIntoView({ block: "nearest", behavior: "smooth" }); });
    L.append(r);
  });
}

/* ---------- building with Claude ---------- */
async function build(s){
  ctl?.abort();
  reset();
  $("exampleTag").hidden = true;
  building = true;
  $("build").disabled = true;
  paint();
  ctl = new AbortController();
  const my = ctl;
  let pending = "", failure = null;
  const eat = chunk => {
    const lines = (pending + chunk).split("\n");
    pending = lines.pop();
    for (const line of lines){ const d = parseLine(line); if (d) addNode(d); }
  };
  try {
    await sample(prompt(s), { signal: my.signal, modelTier: $("tier").value, onText: ({ delta }) => eat(delta) });
  } catch (e) { failure = e; }
  if (my !== ctl) return;
  const last = parseLine(pending);
  if (last) addNode(last);
  building = false;
  $("build").disabled = !sample;
  if (failure && FATAL.includes(failure.code)) shutDown(ERR[failure.code] || "Claude bu sayfada kullanılamıyor.");
  if (steps.length) go(0); else paint();
  if (!steps.length && failure?.code !== "cancelled"){
    $("card").prepend(el("p", "err", failure ? (ERR[failure.code] || "Bağlantı sorunu oldu. Tekrar dene.") : "Anlaşılır bir yanıt gelmedi. Tekrar dene."));
  } else if (failure && failure.code !== "cancelled" && !FATAL.includes(failure.code)){
    $("card").prepend(el("p", "err", (ERR[failure.code] || "Bağlantı yarıda kesildi.") + " Piramit eksik kalmış olabilir."));
  }
}

function shutDown(msg){
  sample = null;
  $("status").innerHTML = "Claude: <b>kapalı</b>";
  $("status").classList.add("off");
  $("build").disabled = true;
  $("banner").textContent = msg;
  $("banner").hidden = false;
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const s = $("sentence").value.trim();
  if (s && sample && !building) build(s);
});
