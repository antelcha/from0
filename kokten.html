<title>Kökten</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: single column; sentence input on top, then an indented tree whose branches draw themselves as Claude names each fact */
:root{
  --bg:#f1f3f6; --surface:#ffffff; --fg:#18202b; --muted:#5a6575; --line:#c9d1dc;
  --accent:#2c4f86; --accent-fg:#ffffff;
  --ok:#2f7a4a; --part:#a8680e; --bad:#b23a2e; --unk:#7a8494;
  --display:"Literata",Georgia,serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#19202a; --fg:#e4e9f0; --muted:#98a3b3; --line:#334050;
  --accent:#8fb2ec; --accent-fg:#0d1420;
  --ok:#6cc48c; --part:#e2a64a; --bad:#ec8679; --unk:#9aa4b3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#19202a; --fg:#e4e9f0; --muted:#98a3b3; --line:#334050;
  --accent:#8fb2ec; --accent-fg:#0d1420;
  --ok:#6cc48c; --part:#e2a64a; --bad:#ec8679; --unk:#9aa4b3; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);padding-inline:16px}
.wrap{max-width:860px;margin:0 auto;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
h1{font:650 34px/1 var(--display);margin:0;letter-spacing:-.01em}
.tag{color:var(--muted);font-size:14px}
.status{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}
.status b{font-weight:500;color:var(--ok)} .status.off b{color:var(--bad)}

.ask{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.ask:focus-within{border-color:var(--accent)}
.ask label{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
textarea{width:100%;box-sizing:border-box;resize:vertical;min-height:72px;border:0;background:transparent;color:var(--fg);font:16px/1.5 var(--body);padding:0}
textarea:focus{outline:none}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.build{font:600 14px var(--body);background:var(--accent);color:var(--accent-fg);border:0;border-radius:9px;padding:9px 18px;cursor:pointer}
.build:disabled{opacity:.5;cursor:default}
select{font:500 12px var(--mono);color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-left:auto;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--c)}

.banner{font-size:14px;color:var(--bad)}
.example{align-self:flex-start;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--part);border:1px solid currentColor;border-radius:999px;padding:3px 10px}

.scroller{overflow-x:auto;padding-bottom:6px}
ul{list-style:none;margin:0;padding:0}
.root{font:500 19px/1.45 var(--display);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;max-width:680px;text-wrap:pretty}
.root::before{content:"Cümle";display:block;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:4px}

.kids{padding-left:28px;margin-left:14px}
.kids.closed{display:none}
.kids>li{position:relative;padding-top:12px}
.kids>li::before{content:"";position:absolute;left:-28px;top:0;width:22px;height:32px;border-left:2px solid var(--line);border-bottom:2px solid var(--line);border-bottom-left-radius:12px;animation:drawH .35s ease-out both;animation-delay:calc(var(--i,0)*110ms)}
.kids>li:not(:last-child)::after{content:"";position:absolute;left:-28px;top:0;bottom:0;border-left:2px solid var(--line);animation:drawV .4s ease-out both;animation-delay:calc(var(--i,0)*110ms)}
.kids>li>.card,.kids>li>.loader{animation:pop .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*110ms + 120ms)}
@keyframes drawH{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes drawV{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes pop{from{opacity:0;transform:translateX(-8px) scale(.98)}to{opacity:1;transform:none}}

.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 13px 11px;min-width:220px;max-width:620px;box-sizing:border-box}
.card::before{content:"";position:absolute;left:-7px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--vc);box-shadow:0 0 0 3px var(--bg)}
.v-dogru{--vc:var(--ok)} .v-kismen{--vc:var(--part)} .v-yanlis{--vc:var(--bad)} .v-belirsiz{--vc:var(--unk)}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.card h3{font:600 15px/1.35 var(--body);margin:0;flex:1 1 200px;text-wrap:balance}
.chip{font:500 11px var(--mono);letter-spacing:.04em;color:var(--vc);white-space:nowrap}
.card p{margin:4px 0 0;font-size:14px;color:var(--fg);overflow-wrap:anywhere}
.card .n{color:var(--vc);font-size:13.5px}
.card .n::before{content:"Düzeltme: ";font-weight:600}
.acts{margin-top:8px;display:flex;gap:10px;align-items:center}
.open{font:600 13px var(--body);color:var(--accent);background:none;border:0;padding:2px 0;cursor:pointer}
.open:disabled{color:var(--muted);cursor:default}
.open.base{color:var(--muted);font-weight:500}
.basechip{font:500 11px var(--mono);color:var(--muted)}
.err{font-size:13px;color:var(--bad)}

.loader{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding:8px 2px}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.18s} .dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.stop{font:500 12px var(--body);color:var(--muted);background:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer}

button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
@media (max-width:480px){h1{font-size:28px}.kids{padding-left:20px;margin-left:8px}.kids>li::before,.kids>li:not(:last-child)::after{left:-20px}.kids>li::before{width:15px}.card{min-width:200px}}
</style>

<div class="wrap">
  <header>
    <h1>Kökten</h1>
    <span class="tag">Bir cümleyi dayandığı fact'lere kadar aç.</span>
    <span class="status" id="status">bağlanıyor…</span>
  </header>

  <form class="ask" id="form">
    <label for="sentence">Anlamak istediğin cümle</label>
    <textarea id="sentence">Sulawesi Adası'nda ölüleriyle yaşayan Toraja Kabilesi. Toraja Halkı ölülerini gömmeden önce birkaç seneye kadar beraber yaşayabiliyorlar hatta yemek ikram ediyorlar ölülerine.</textarea>
    <div class="row">
      <button class="build" id="build" type="submit" disabled>Ağacı kur</button>
      <select id="tier" aria-label="Model">
        <option value="quick">hızlı</option>
        <option value="default" selected>dengeli</option>
        <option value="complex">derin</option>
      </select>
      <div class="legend">
        <span style="--c:var(--ok)">doğru</span>
        <span style="--c:var(--part)">kısmen</span>
        <span style="--c:var(--bad)">yanlış</span>
        <span style="--c:var(--unk)">belirsiz</span>
      </div>
    </div>
  </form>

  <div class="banner" id="banner" hidden></div>
  <span class="example" id="exampleTag">Örnek ağaç · kendi cümleni yazıp "Ağacı kur"a bas</span>

  <div class="scroller"><ul id="tree"></ul></div>
</div>

<script>
const $ = id => document.getElementById(id);
const VERDICT = { dogru: "doğru", kismen: "kısmen doğru", yanlis: "yanlış", belirsiz: "belirsiz" };
const FORMAT = `Her satıra tek bir JSON nesnesi yaz. Başka hiçbir şey yazma: giriş cümlesi, kod bloğu, numara yok.
{"t":"kısa başlık, en fazla 8 kelime","d":"2-3 cümlelik somut açıklama; yer, sayı, isim ver","v":"dogru|kismen|yanlis|belirsiz","n":"v kismen, yanlis ya da belirsiz ise neyin farklı olduğu; dogru ise boş","k":true}
"v": iddianın gerçekte ne kadar doğru olduğu. "k": bu iddiayı anlamak için daha temel fact'lere inilebiliyorsa true; artık herkesin bildiği temel bir bilgiyse false.
Her şeyi Türkçe yaz.`;

const ERR = {
  not_granted: "Bu sayfanın Claude kullanmasına izin verilmedi. İzin vermek için sayfayı yeniden yükle.",
  sampling_disabled: "Bu hesapta Claude kullanılamıyor.",
  rate_limited: "Çok fazla istek gitti ya da kullanım limitin doldu. Biraz sonra tekrar dene.",
  session_expired: "Oturumun kapanmış. claude.ai'a tekrar giriş yap.",
  refused: "Claude bu dala yanıt vermedi.",
  prompt_too_large: "Metin çok uzun. Daha kısa bir cümle dene.",
};
const FATAL = ["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"];

let sample = null;
let root = null;
const running = new Set();

/* ---------- prompts ---------- */
function rootPrompt(s){
  return `Kullanıcı şu cümleyi temelden anlamak istiyor:
"""${s}"""

Cümleyi içerdiği ayrı iddialara (fact'lere) ayır. Her iddia tek bir şey söylesin. Cümlede açıkça yazmayan ama cümlenin dayandığı örtük bilgileri de ekle (örneğin bir yerin nerede olduğu, bir kavramın ne olduğu). Cümledeki abartı ya da hataları "v" ve "n" ile belirt. 3-7 iddia.

${FORMAT}`;
}
function childPrompt(n){
  const path = [];
  for (let p = n; p && p !== root; p = p.parent) path.unshift(p);
  const trail = path.map((p, i) => `${i + 1}. ${p.t}`).join("\n");
  return `Kullanıcı şu cümleyi temelden anlamaya çalışıyor:
"""${root.t}"""

Bir fact ağacında şu yoldan aşağı iniyor:
${trail}

Son iddia: "${n.t}". ${n.d}

Bu son iddiayı anlamak için bilinmesi gereken daha temel fact'leri ver: neden böyle, neye dayanıyor, hangi kavramı ya da tarihi bilmek gerekiyor. Yoldaki üst iddiaları tekrar etme. 2-5 fact.

${FORMAT}`;
}

/* ---------- parsing ---------- */
function parseLine(line){
  const a = line.indexOf("{"), b = line.lastIndexOf("}");
  if (a < 0 || b <= a) return null;
  try {
    const o = JSON.parse(line.slice(a, b + 1));
    const t = String(o.t || "").trim(), d = String(o.d || "").trim();
    if (!t) return null;
    const v = VERDICT[o.v] ? o.v : "belirsiz";
    return { t, d, v, n: String(o.n || "").trim(), k: o.k !== false };
  } catch { return null; }
}

/* ---------- rendering ---------- */
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function renderRoot(){
  const tree = $("tree");
  tree.textContent = "";
  const li = el("li");
  li.appendChild(el("div", "root", root.t));
  root.kidsEl = el("ul", "kids");
  li.appendChild(root.kidsEl);
  tree.appendChild(li);
}

function addChild(parent, data, i){
  const n = { ...data, parent, kids: null };
  parent.kids.push(n);
  const li = el("li");
  li.style.setProperty("--i", i);
  const card = el("div", "card v-" + n.v);
  const top = el("div", "top");
  top.append(el("h3", null, n.t), el("span", "chip", VERDICT[n.v]));
  card.appendChild(top);
  if (n.d) card.appendChild(el("p", "d", n.d));
  if (n.n && n.v !== "dogru") card.appendChild(el("p", "n", n.n));
  const acts = el("div", "acts");
  n.btn = el("button", "open" + (n.k ? "" : " base"), n.k ? "Neye dayanıyor? ↓" : "Yine de aç ↓");
  n.btn.type = "button";
  n.btn.disabled = !sample;
  n.btn.addEventListener("click", () => toggle(n));
  if (!n.k) acts.appendChild(el("span", "basechip", "temel bilgi"));
  acts.prepend(n.btn);
  card.appendChild(acts);
  li.appendChild(card);
  n.kidsEl = el("ul", "kids");
  li.appendChild(n.kidsEl);
  parent.kidsEl.appendChild(li);
  return n;
}

function setOpenLabel(n){
  const c = n.kids.length;
  n.btn.textContent = n.kidsEl.classList.contains("closed") ? `Göster (${c}) ↓` : `Gizle (${c}) ↑`;
}

function toggle(n){
  if (n.loading) return;
  if (n.kids && n.kids.length){
    n.kidsEl.classList.toggle("closed");
    setOpenLabel(n);
    return;
  }
  load(n);
}

/* ---------- asking Claude ---------- */
async function load(n){
  if (!sample) return;
  n.loading = true;
  n.kids = [];
  n.kidsEl.textContent = "";
  n.kidsEl.classList.remove("closed");
  if (n.btn){ n.btn.disabled = true; n.btn.textContent = "Açılıyor…"; }
  n.errEl?.remove(); n.errEl = null;

  const ctl = new AbortController();
  running.add(ctl);
  const loadLi = el("li");
  const loader = el("div", "loader");
  const dots = el("span", "dots"); dots.append(el("i"), el("i"), el("i"));
  const stop = el("button", "stop", "Durdur"); stop.type = "button";
  stop.addEventListener("click", () => ctl.abort());
  loader.append(dots, el("span", null, "Claude düşünüyor"), stop);
  loadLi.appendChild(loader);
  n.kidsEl.appendChild(loadLi);

  let pending = "";
  const eat = chunk => {
    const lines = (pending + chunk).split("\n");
    pending = lines.pop();
    for (const line of lines){
      const d = parseLine(line);
      if (d){ addChild(n, d, 0); n.kidsEl.appendChild(loadLi); }
    }
  };

  let failure = null;
  try {
    await sample(n === root ? rootPrompt(n.t) : childPrompt(n), {
      signal: ctl.signal,
      modelTier: $("tier").value,
      onText: ({ delta }) => eat(delta),
    });
  } catch (e) {
    failure = e;
  } finally {
    running.delete(ctl);
  }
  const last = parseLine(pending);
  if (last) addChild(n, last, 0);
  loadLi.remove();
  n.loading = false;

  if (failure && FATAL.includes(failure.code)){ shutDown(ERR[failure.code] || "Claude bu sayfada kullanılamıyor."); }
  if (!n.kids.length){
    n.kids = null;
    if (failure?.code !== "cancelled" && !(failure && FATAL.includes(failure.code))){
      const msg = failure ? (ERR[failure.code] || "Bağlantı sorunu oldu.") : "Anlaşılır bir yanıt gelmedi.";
      showError(n, msg + " Tekrar denemek için butona bas.");
    }
    if (n.btn){ n.btn.disabled = !sample; n.btn.textContent = n.k ? "Neye dayanıyor? ↓" : "Yine de aç ↓"; }
    return;
  }
  if (failure && failure.code !== "cancelled" && !FATAL.includes(failure.code)){
    showError(n, (ERR[failure.code] || "Bağlantı yarıda kesildi.") + " Bu dal eksik kalmış olabilir.");
  }
  if (n.btn){ n.btn.disabled = false; setOpenLabel(n); }
}

function showError(n, msg){
  const e = el("p", "err", msg);
  if (n === root){ e.style.marginTop = "10px"; root.kidsEl.before(e); }
  else n.btn.closest(".card").appendChild(e);
  n.errEl = e;
}

function shutDown(msg){
  sample = null;
  $("status").innerHTML = "Claude: <b>kapalı</b>";
  $("status").classList.add("off");
  $("build").disabled = true;
  document.querySelectorAll(".open").forEach(b => b.disabled = true);
  $("banner").textContent = msg;
  $("banner").hidden = false;
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const s = $("sentence").value.trim();
  if (!s || !sample) return;
  running.forEach(c => c.abort());
  $("exampleTag").hidden = true;
  root = { t: s, kids: [], parent: null };
  renderRoot();
  load(root);
});

/* ---------- example tree (shown until the first build) ---------- */
const EXAMPLE = {
  t: $("sentence").value,
  kids: [
    { t: "Sulawesi, Endonezya'da bir ada", d: "Sulawesi, Borneo ile Yeni Gine arasında, Endonezya'nın en büyük adalarından biri. Dört kollu, alışılmadık bir şekli var.", v: "dogru", n: "", k: true },
    { t: "Toraja, Güney Sulawesi dağlarında yaşayan bir halk", d: "Toraja halkı adanın güneyindeki dağlık Tana Toraja bölgesinde yaşar. Çoğu bugün Hristiyan, ama eski Aluk To Dolo inancının cenaze gelenekleri sürüyor.", v: "dogru", n: "", k: true },
    { t: "Ölüler aylarca, bazen yıllarca evde kalır", d: "Ölen kişi cenaze töreni yapılana kadar ailenin evinde tutulur. Bu süre birkaç haftadan birkaç yıla uzayabilir. Beden eskiden bitkilerle, bugün çoğunlukla formalinle korunur.", v: "dogru", n: "", k: true },
    { t: "Ölü, ölmüş değil 'hasta' sayılır", d: "Cenazeye kadar kişiye to makula', yani hasta denir. Aile onunla konuşur ve odasında yalnız bırakmamaya çalışır.", v: "dogru", n: "", k: true },
    { t: "Ölülere yemek ikram edilir", d: "Hasta sayılan kişiye günde birkaç kez yemek, su ve kahve götürülür. Bu, ona hâlâ ailenin bir üyesi gibi davranmanın parçasıdır.", v: "dogru", n: "", k: false },
    { t: "Gömmeyi geciktiren şey pahalı cenaze töreni", d: "Rambu Solo' adlı tören günlerce sürer ve çok sayıda manda ile domuz kurban edilir. Aile bu masrafı biriktirene kadar tören ertelenir.", v: "dogru", n: "", k: true,
      kids: [
        { t: "Manda, Toraja'da zenginlik ölçüsü", d: "Su mandası (tedong) statü göstergesidir. Alacalı bir manda çok yüksek fiyatlara, bazen bir otomobil fiyatına satılır.", v: "dogru", n: "", k: true },
        { t: "Kurbanlar ruhu öbür dünyaya taşır", d: "Aluk To Dolo inancına göre ruh, Puya denen öbür dünyaya gider. Kurban edilen mandalar bu yolculukta ona eşlik eder.", v: "dogru", n: "", k: true },
      ] },
    { t: "Ölüler aslında gömülmez", d: "Cümle 'gömmeden önce' diyor, ama tören sonunda beden toprağa değil kayalara oyulmuş mezarlara, mağaralara ya da asılı tabutlara konur.", v: "kismen", n: "Toraja ölülerini çoğunlukla toprağa gömmez; 'defnetmek' daha doğru bir ifade.", k: true },
  ],
};

function renderExample(){
  root = { t: EXAMPLE.t, kids: [], parent: null };
  renderRoot();
  EXAMPLE.kids.forEach((d, i) => {
    const n = addChild(root, d, i);
    if (d.kids){
      n.kids = [];
      d.kids.forEach((dd, j) => addChild(n, dd, i + j + 1));
      setOpenLabel(n);
    }
  });
}
renderExample();

/* ---------- connect ---------- */
(async () => {
  try { sample = window.claude ? await window.claude.use("sample") : null; } catch { sample = null; }
  if (sample){
    $("status").innerHTML = "Claude: <b>hazır</b>";
    $("build").disabled = false;
    document.querySelectorAll(".open").forEach(b => b.disabled = false);
  } else {
    shutDown("Claude'a buradan ulaşılamıyor. Sayfayı claude.ai'da giriş yapmış olarak açman gerekiyor.");
  }
})();
</script>
