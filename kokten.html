<title>Kökten</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: input on top; a pyramid of facts (axioms at the base, the sentence at the apex) drawn bottom-up; a sticky panel that walks the derivation step by step */
:root{
  --bg:#f1f3f6; --surface:#ffffff; --fg:#18202b; --muted:#5a6575; --line:#c3ccd8;
  --accent:#2c4f86; --accent-fg:#ffffff; --base:#e4eaf3; --hot:#d08a1f;
  --ok:#2f7a4a; --part:#a8680e; --bad:#b23a2e; --unk:#7a8494;
  --display:"Literata",Georgia,serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#19202a; --fg:#e4e9f0; --muted:#98a3b3; --line:#3a4757;
  --accent:#8fb2ec; --accent-fg:#0d1420; --base:#202b3a; --hot:#f0b252;
  --ok:#6cc48c; --part:#e2a64a; --bad:#ec8679; --unk:#9aa4b3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#19202a; --fg:#e4e9f0; --muted:#98a3b3; --line:#3a4757;
  --accent:#8fb2ec; --accent-fg:#0d1420; --base:#202b3a; --hot:#f0b252;
  --ok:#6cc48c; --part:#e2a64a; --bad:#ec8679; --unk:#9aa4b3; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);padding-inline:16px}
.wrap{max-width:980px;margin:0 auto;padding-block:24px 24px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
h1{font:650 34px/1 var(--display);margin:0;letter-spacing:-.01em}
.tag{color:var(--muted);font-size:14px}
.status{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}
.status b{font-weight:500;color:var(--ok)} .status.off b{color:var(--bad)}

.ask{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.ask:focus-within{border-color:var(--accent)}
.lbl{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
textarea{width:100%;box-sizing:border-box;resize:vertical;min-height:64px;border:0;background:transparent;color:var(--fg);font:16px/1.5 var(--body);padding:0}
textarea:focus{outline:none}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.btn{font:600 14px var(--body);background:var(--accent);color:var(--accent-fg);border:0;border-radius:9px;padding:9px 18px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
select{font:500 12px var(--mono);color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 6px}
.banner{font-size:14px;color:var(--bad)}
.example{align-self:center;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--part);border:1px solid currentColor;border-radius:999px;padding:3px 10px}

/* pyramid */
.scroller{overflow-x:auto;padding-block:6px}
.stage{position:relative;min-width:max-content;margin:0 auto;display:flex;flex-direction:column;gap:46px;padding:4px 8px 4px}
.stage svg{position:absolute;inset:0;pointer-events:none;overflow:visible}
.layer{display:flex;justify-content:center;gap:10px;position:relative;z-index:1}
.axis{display:flex;justify-content:center;margin-top:-34px;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding-inline:8px}

.node{position:relative;width:118px;box-sizing:border-box;padding:8px 9px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 12.5px/1.3 var(--body);text-align:center;text-wrap:balance;cursor:pointer;animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0ms);transition:opacity .35s,border-color .2s,box-shadow .2s,transform .2s}
.node.l0{background:var(--base)}
.node.apex{width:auto;max-width:300px;padding:10px 16px;font:650 15px/1.3 var(--display)}
.node:hover{border-color:var(--accent)}
.node .dot{position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--vc);box-shadow:0 0 0 2px var(--bg)}
.v-kismen{--vc:var(--part)} .v-yanlis{--vc:var(--bad)} .v-belirsiz{--vc:var(--unk)} .v-dogru{--vc:var(--ok)}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);transform:translateY(-2px)}
.node.in{border-color:var(--hot);box-shadow:0 0 0 2px var(--hot)}
.node.out{border-style:dashed;border-color:var(--accent)}
.node.veil{opacity:.08;pointer-events:none;animation:none}
.node.just{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}

path.e{fill:none;stroke:var(--line);stroke-width:1.6;transition:opacity .35s,stroke .2s}
path.e.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s ease-out forwards;animation-delay:var(--d,0ms)}
path.e.hot{stroke:var(--hot);stroke-width:2.4}
path.e.veil{opacity:0}
@keyframes draw{to{stroke-dashoffset:0}}

/* panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.panel h2{font:650 19px/1.3 var(--display);margin:0;text-wrap:balance}
.panel p{margin:0;max-width:68ch}
.panel .n{color:var(--vc)} .panel .n b{font-weight:600}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.verdict{font:500 11px var(--mono);color:var(--vc)}
.refs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.ref{font:500 12.5px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--hot);border-radius:999px;padding:3px 10px;cursor:pointer}
.ref.up{border-color:var(--accent);border-style:dashed}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px}
.count{font:500 12px var(--mono);color:var(--muted);margin-right:auto}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.18s} .dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.err{color:var(--bad);font-size:14px}

button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}path.e.draw{stroke-dashoffset:0}}
@media (max-width:480px){h1{font-size:28px}.node{width:104px;font-size:12px}.stage{gap:38px}}
</style>

<div class="wrap">
  <header>
    <h1>Kökten</h1>
    <span class="tag">Bir cümleyi aksiyomlarından başlayarak anla.</span>
    <span class="status" id="status">bağlanıyor…</span>
  </header>

  <form class="ask" id="form">
    <label class="lbl" for="sentence">Anlamak istediğin cümle</label>
    <textarea id="sentence">Sulawesi Adası'nda ölüleriyle yaşayan Toraja Kabilesi. Toraja Halkı ölülerini gömmeden önce birkaç seneye kadar beraber yaşayabiliyorlar hatta yemek ikram ediyorlar ölülerine.</textarea>
    <div class="row">
      <button class="btn" id="build" type="submit" disabled>Piramidi kur</button>
      <select id="tier" aria-label="Model">
        <option value="quick">hızlı</option>
        <option value="default" selected>dengeli</option>
        <option value="complex">derin</option>
      </select>
    </div>
  </form>

  <div class="banner" id="banner" hidden></div>
  <span class="example" id="exampleTag">Örnek piramit · kendi cümleni yazıp "Piramidi kur"a bas</span>

  <div class="scroller" id="scroller">
    <div class="stage" id="stage"><svg id="edges" aria-hidden="true"></svg></div>
  </div>

  <section class="panel" id="panel" aria-live="polite"></section>
</div>

<script>
const $ = id => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";
const VERDICT = { dogru: "doğru", kismen: "kısmen doğru", yanlis: "yanlış", belirsiz: "belirsiz" };
const ERR = {
  not_granted: "Bu sayfanın Claude kullanmasına izin verilmedi. İzin vermek için sayfayı yeniden yükle.",
  sampling_disabled: "Bu hesapta Claude kullanılamıyor.",
  rate_limited: "Çok fazla istek gitti ya da kullanım limitin doldu. Biraz sonra tekrar dene.",
  session_expired: "Oturumun kapanmış. claude.ai'a tekrar giriş yap.",
  refused: "Claude bu cümle için piramit kurmadı. Cümleyi değiştirip tekrar dene.",
  prompt_too_large: "Metin çok uzun. Daha kısa bir cümle dene.",
};
const FATAL = ["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"];

function prompt(s){
  return `Kullanıcı şu cümleyi, bir matematik ifadesini aksiyomlardan kurar gibi, en temel bilgilerden başlayarak anlamak istiyor:
"""${s}"""

Bu cümleyi tepeye koyan bir bilgi piramidi kur:
- Seviye 0: aksiyomlar. Başka bir şeye dayanmadan anlaşılan, herkesin kabul edeceği en temel fact'ler. 5-8 tane.
- Her üst seviyedeki fact, yalnızca daha alt seviyelerdeki fact'lerden çıkar. Yukarı çıktıkça her seviyede daha az fact olsun.
- En üstte tek düğüm: cümlenin kendisi, kısaltılmış hâliyle. Toplam 4-6 seviye.
- "u": düğümün dayandığı alt düğümlerin id'leri. Seviye 0'da boş. Diğer her düğüm en az bir alt düğüme dayansın. Tepe dışındaki her düğüm en az bir üst düğümde kullanılsın.
- "d": aksiyomlarda fact'in kendisini açıkla. Üst düğümlerde bu fact'in dayandığı düğümlerden NASIL çıktığını açıkla.
- Cümledeki hata ya da abartıları ilgili düğümde "v" ve "n" ile belirt; tepe düğümün "v" değeri cümlenin bütün olarak ne kadar doğru olduğunu söylesin.

Düğümleri seviye sırasıyla yaz: önce bütün seviye 0, sonra seviye 1, en son tepe. Her satıra tek bir JSON nesnesi yaz. Başka hiçbir şey yazma: giriş, kod bloğu, numara yok.
{"id":"a1","l":0,"t":"en fazla 6 kelimelik başlık","d":"1-3 cümle","u":[],"v":"dogru|kismen|yanlis|belirsiz","n":"v dogru değilse düzeltme, dogru ise boş"}
Her şeyi Türkçe yaz.`;
}

/* ---------- state ---------- */
let sample = null;
let nodes = new Map();      // id -> node
let order = [];             // insertion order (bottom-up)
let edges = [];             // {from: lower id, to: upper id, path}
let layers = new Map();     // level -> element
let selected = null;
let step = -1;              // -1 = free mode, else index into steps
let steps = [];
let building = false;
let ctl = null;

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function reset(){
  nodes = new Map(); order = []; edges = []; layers = new Map();
  selected = null; step = -1; steps = [];
  const stage = $("stage");
  stage.querySelectorAll(".layer,.axis").forEach(x => x.remove());
  $("edges").textContent = "";
  const axis = el("div", "axis");
  axis.style.order = 1;
  axis.append(el("span", null, "↑ temel bilgiler · aksiyomlar"));
  stage.appendChild(axis);
}

function layer(l){
  if (!layers.has(l)){
    const row = el("div", "layer");
    row.style.order = -l;
    layers.set(l, row);
    $("stage").appendChild(row);
  }
  return layers.get(l);
}

function parseLine(line){
  const a = line.indexOf("{"), b = line.lastIndexOf("}");
  if (a < 0 || b <= a) return null;
  try {
    const o = JSON.parse(line.slice(a, b + 1));
    const id = String(o.id || "").trim(), t = String(o.t || "").trim();
    const l = Math.max(0, Math.round(Number(o.l)) || 0);
    if (!id || !t || nodes.has(id)) return null;
    return { id, l, t, d: String(o.d || "").trim(), u: Array.isArray(o.u) ? o.u.map(String) : [],
             v: VERDICT[o.v] ? o.v : "belirsiz", n: String(o.n || "").trim() };
  } catch { return null; }
}

function addNode(d, delay = 0){
  const n = { ...d, u: d.u.filter(x => nodes.has(x) && nodes.get(x).l < d.l), ups: [] };
  nodes.set(n.id, n); order.push(n);
  const b = el("button", "node v-" + n.v, n.t);
  b.type = "button";
  if (n.l === 0) b.classList.add("l0");
  b.style.setProperty("--d", delay + "ms");
  if (n.v !== "dogru") b.appendChild(el("i", "dot"));
  b.addEventListener("click", () => select(n.id));
  n.el = b;
  layer(n.l).appendChild(b);
  for (const id of n.u){
    nodes.get(id).ups.push(n.id);
    const p = document.createElementNS(SVGNS, "path");
    p.setAttribute("class", "e draw");
    p.setAttribute("pathLength", "1");
    p.style.setProperty("--d", (delay + 150) + "ms");
    $("edges").appendChild(p);
    edges.push({ from: id, to: n.id, path: p });
  }
  layoutSoon();
  return n;
}

function markApex(){
  let max = -1;
  for (const n of order) max = Math.max(max, n.l);
  for (const n of order) n.el.classList.toggle("apex", n.l === max && order.length > 1);
  layoutSoon();
}

/* ---------- edges geometry ---------- */
let raf = 0;
function layoutSoon(){ if (!raf) raf = requestAnimationFrame(() => { raf = 0; layout(); }); }
function layout(){
  const stage = $("stage"), r0 = stage.getBoundingClientRect();
  const svg = $("edges");
  svg.setAttribute("width", stage.scrollWidth); svg.setAttribute("height", stage.scrollHeight);
  for (const e of edges){
    const a = nodes.get(e.from).el.getBoundingClientRect(), b = nodes.get(e.to).el.getBoundingClientRect();
    const x1 = a.left + a.width / 2 - r0.left, y1 = a.top - r0.top;
    const x2 = b.left + b.width / 2 - r0.left, y2 = b.bottom - r0.top;
    const my = (y1 + y2) / 2;
    e.path.setAttribute("d", `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`);
  }
}
new ResizeObserver(layoutSoon).observe($("stage"));
function centerScroll(){ const s = $("scroller"); s.scrollLeft = (s.scrollWidth - s.clientWidth) / 2; }

/* ---------- selection & panel ---------- */
function levelName(n){
  if (n.el.classList.contains("apex")) return "Cümle";
  return n.l === 0 ? "Aksiyom" : `Seviye ${n.l}`;
}

function select(id){
  selected = id;
  const n = nodes.get(id);
  for (const m of order) m.el.classList.remove("sel", "in", "out");
  for (const e of edges) e.path.classList.toggle("hot", e.to === id);
  if (n){
    n.el.classList.add("sel");
    n.u.forEach(x => nodes.get(x).el.classList.add("in"));
    if (step < 0) n.ups.forEach(x => nodes.get(x).el.classList.add("out"));
  }
  renderPanel();
}

function refChip(id, up){
  const m = nodes.get(id);
  const c = el("button", "ref" + (up ? " up" : ""), m.t);
  c.type = "button";
  c.addEventListener("click", () => { if (step >= 0) exitSteps(); select(id); });
  return c;
}

function renderPanel(){
  const p = $("panel");
  p.textContent = "";
  if (building){
    const row = el("div", "loading");
    const dots = el("span", "dots"); dots.append(el("i"), el("i"), el("i"));
    const stop = el("button", "btn ghost", "Durdur"); stop.type = "button";
    stop.addEventListener("click", () => ctl?.abort());
    row.append(dots, el("span", null, order.length ? `Claude piramidi kuruyor · ${order.length} fact` : "Claude aksiyomları düşünüyor"));
    p.append(row);
    const nav = el("div", "nav"); nav.append(el("span", "count"), stop); p.append(nav);
    return;
  }
  if (!order.length){ p.append(el("p", null, "Bir cümle yaz ve piramidi kur.")); return; }

  const n = nodes.get(selected);
  if (n){
    const meta = el("div", "meta v-" + n.v);
    meta.append(el("span", "lbl", levelName(n)), el("span", "verdict", VERDICT[n.v]));
    p.append(meta, el("h2", null, n.t));
    if (n.d) p.append(el("p", null, n.d));
    if (n.n && n.v !== "dogru"){
      const c = el("p", "n v-" + n.v); c.append(el("b", null, "Düzeltme: "), n.n); p.append(c);
    }
    if (n.u.length){
      const r = el("div", "refs"); r.append(el("span", null, "Dayandığı:"));
      n.u.forEach(id => r.append(refChip(id, false))); p.append(r);
    }
    if (step < 0 && n.ups.length){
      const r = el("div", "refs"); r.append(el("span", null, "Üstüne kurulan:"));
      n.ups.forEach(id => r.append(refChip(id, true))); p.append(r);
    }
  } else {
    p.append(el("p", null, "Aksiyomlardan başlayıp cümleye kadar adım adım çık. Ya da piramitte istediğin bir düğüme tıkla."));
  }

  const nav = el("div", "nav");
  if (step >= 0){
    nav.append(el("span", "count", `Adım ${step + 1} / ${steps.length}`));
    const back = el("button", "btn ghost", "← Geri"); back.type = "button"; back.disabled = step === 0;
    back.addEventListener("click", () => setStep(step - 1));
    const all = el("button", "btn ghost", "Hepsini göster"); all.type = "button";
    all.addEventListener("click", () => { exitSteps(); select(steps[steps.length - 1].id); });
    const next = el("button", "btn", step === steps.length - 1 ? "Bitti" : "İleri →"); next.type = "button";
    next.addEventListener("click", () => step === steps.length - 1 ? exitSteps() : setStep(step + 1));
    nav.append(back, all, next);
  } else {
    nav.append(el("span", "count", `${order.length} fact · ${new Set(order.map(x => x.l)).size} seviye`));
    const go = el("button", "btn", "Aksiyomlardan başla ↑"); go.type = "button";
    go.addEventListener("click", startSteps);
    nav.append(go);
  }
  p.append(nav);
}

/* ---------- step-by-step mode ---------- */
function startSteps(){
  steps = [...order].sort((a, b) => a.l - b.l);
  setStep(0);
}
function setStep(k){
  step = k;
  const shown = new Set(steps.slice(0, k + 1).map(n => n.id));
  for (const n of order){
    const was = n.el.classList.contains("veil");
    n.el.classList.toggle("veil", !shown.has(n.id));
    if (was && shown.has(n.id)){ n.el.classList.remove("just"); void n.el.offsetWidth; n.el.classList.add("just"); }
  }
  for (const e of edges){
    const vis = shown.has(e.from) && shown.has(e.to);
    e.path.classList.toggle("veil", !vis);
    if (vis && e.to === steps[k].id){ e.path.classList.remove("draw"); void e.path.getBBox(); e.path.style.setProperty("--d", "120ms"); e.path.classList.add("draw"); }
  }
  select(steps[k].id);
  steps[k].el.scrollIntoView({ block: "nearest", inline: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}
function exitSteps(){
  step = -1;
  for (const n of order) n.el.classList.remove("veil");
  for (const e of edges) e.path.classList.remove("veil");
  select(selected);
}

/* ---------- building with Claude ---------- */
async function build(s){
  ctl?.abort();
  reset();
  $("exampleTag").hidden = true;
  building = true;
  $("build").disabled = true;
  renderPanel();
  ctl = new AbortController();
  const my = ctl;
  let pending = "", failure = null;
  const eat = chunk => {
    const lines = (pending + chunk).split("\n");
    pending = lines.pop();
    for (const line of lines){
      const d = parseLine(line);
      if (d){ addNode(d); if (order.length === 1) requestAnimationFrame(centerScroll); renderPanel(); }
    }
  };
  try {
    await sample(prompt(s), { signal: my.signal, modelTier: $("tier").value, onText: ({ delta }) => eat(delta) });
  } catch (e) { failure = e; }
  if (my !== ctl) return;           // a newer build replaced this one
  const last = parseLine(pending);
  if (last) addNode(last);
  building = false;
  $("build").disabled = !sample;
  markApex();
  requestAnimationFrame(centerScroll);

  if (failure && FATAL.includes(failure.code)){ shutDown(ERR[failure.code] || "Claude bu sayfada kullanılamıyor."); }
  renderPanel();
  if (!order.length && failure?.code !== "cancelled"){
    $("panel").prepend(el("p", "err", failure ? (ERR[failure.code] || "Bağlantı sorunu oldu. Tekrar dene.") : "Anlaşılır bir yanıt gelmedi. Tekrar dene."));
  } else if (failure && failure.code !== "cancelled" && !FATAL.includes(failure.code)){
    $("panel").prepend(el("p", "err", (ERR[failure.code] || "Bağlantı yarıda kesildi.") + " Piramit eksik kalmış olabilir."));
  }
}

function shutDown(msg){
  sample = null;
  $("status").innerHTML = "Claude: <b>kapalı</b>";
  $("status").classList.add("off");
  $("build").disabled = true;
  $("banner").textContent = msg;
  $("banner").hidden = false;
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const s = $("sentence").value.trim();
